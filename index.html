<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tien Nguyen – Apps</title>
<style>:root{--bg:#f4f6f8;--paper:#fff;--ink:#18202a;--muted:#55606e;--line:#dbe1e8;--brand:#1f4e9c;--brand-ink:#fff;--link:#1f4e9c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--paper:#171c23;--ink:#e4e8ee;--muted:#a6b0bd;--line:#2a323d;--brand:#1f3f78;--brand-ink:#f2f5fa;--link:#9cc0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.band{background:var(--brand);color:var(--brand-ink);padding:28px 16px 22px}
.band-inner,main{max-width:46rem;margin:0 auto}
.band h1{margin:0;font-size:clamp(1.5rem,4vw,2rem);line-height:1.2}
.band p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.switch{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.switch a{color:var(--brand-ink);text-decoration:none;font-size:.9rem;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.switch a.on{background:var(--brand-ink);color:var(--brand);font-weight:600}
main{padding:24px 16px 56px}
article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,34px);margin-bottom:20px}
h2{font-size:1.2rem;color:var(--link);margin:1.8rem 0 .4rem}
h2:first-child{margin-top:0}
ul{padding-inline-start:1.2em}
li{margin:.3rem 0}
.table-wrap{overflow-x:auto;margin:.6rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.85rem}
a{color:var(--link)}
.key{font-weight:600}
.meta{color:var(--muted);font-size:.9rem}
[dir=rtl]{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.9}
.apps a{display:block;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600;text-decoration:none}
@media (max-width:600px){
table,tbody,tr,td{display:block;width:100%}
thead{display:none}
tr{padding:10px 0;border-bottom:1px solid var(--line)}
td{border:0;padding:2px 0}
td.key{font-size:1.02rem}
td+td{color:var(--ink)}
td:last-child{color:var(--muted)}
}
</style>
</head>
<body>
<header class="band"><div class="band-inner">
<h1>Tien Nguyen – Apps</h1>
<p>Android apps</p>
<nav class="switch" aria-label="Language"><a href="#en" data-lang="en" lang="en">English</a></nav>
</div></header>
<main>
<article data-lang="en" lang="en" dir="ltr"><h2>Privacy policies</h2>
<div class="apps">
<a href="salah-times.html">Salah Times – Prayer &amp; Qibla</a>
<a href="hijab-color.html">Hijab Color Match</a>
<a href="ujian-sim.html">Latihan Ujian SIM</a>
<a href="tes-koran.html">Tes Koran</a>
<a href="skd-cpns.html">Latihan SKD CPNS</a>
</div>
<p class="meta">Apps by Tien Nguyen, an independent Android developer.</p></article>
<p class="meta"><a href="index.html">All apps</a></p>
</main>

</body>
</html>
